# /etc/nginx/sites-available/aiinterview
# 部署后：先改 server_name，再 ln -s 到 sites-enabled，nginx -t 通过后 reload。
# HTTPS 部分交给 certbot --nginx 自动追加，不要手写 443 段。

# Content-free timings correlate with X-Request-ID; never log bodies, cookies or query strings.
log_format ai_timing escape=json '{"request_id":"$upstream_http_x_request_id","status":$status,"edge_request_s":"$request_time","upstream_headers_s":"$upstream_header_time","upstream_total_s":"$upstream_response_time"}';

server {
    listen 80;
    listen [::]:80;
    server_name mymianshiguan.cn www.mymianshiguan.cn;

    # 与 app.py 的 MAX_CONTENT_LENGTH=25MB 对齐，否则大录音会被 Nginx 先 413
    client_max_body_size 26m;

    # 静态资源由 Nginx 直接返回，不占用 Python 线程
    location /static/ {
        alias /var/www/aiinterview/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        # 转写/评分链路可能跑 1–3 分钟，必须放宽
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/aiinterview.access.log ai_timing;
    error_log  /var/log/nginx/aiinterview.error.log;
}
